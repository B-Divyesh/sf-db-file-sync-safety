[package]
name = "db-file-sync-safety"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Make verified SQLite snapshots before file sync"
repository = "https://github.com/B-Divyesh/sf-db-file-sync-safety"

[[bin]]
name = "dbsync-safe"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
name = "dbsync-safe"
maintainer = "Param Factory"
copyright = "2026 Param Factory"
license-file = ["LICENSE", "0"]
extended-description = "A local SQLite preflight, snapshot, and restore verifier for file-sync workflows."
section = "utils"
priority = "optional"
assets = [
  ["target/release/dbsync-safe", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/dbsync-safe/README.md", "644"]
]
